<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="dark light" />
    <!-- Theme before first paint: light unless the visitor picked dark (src/lib/theme.js). -->
    <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}t=t==='dark'?'dark':'light';document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='light'?'#ffffff':'#0a0b14'})()</script>
    <script>
      window.clarity = window.clarity || function(){(window.clarity.q = window.clarity.q || []).push(arguments)};
      (function(){var done=false;function loadScript(src){var s=document.createElement('script');s.async=true;s.src=src;document.head.appendChild(s);}
      function load(){if(done)return;done=true;loadScript('https://www.clarity.ms/tag/zay4a9g664');}
      function idle(){(window.requestIdleCallback||function(f){setTimeout(f,1)})(load,{timeout:4000});}
      if(document.readyState==='complete')setTimeout(idle,2500);else addEventListener('load',function(){setTimeout(idle,2500);});
      ['pointerdown','keydown','scroll'].forEach(function(e){addEventListener(e,load,{once:true,passive:true});});})();
    </script>
    <title>Page not found · Pushpendra Singh Sodha</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      @font-face { font-family: 'Inter Tight'; font-display: swap; font-weight: 100 900; src: url('/fonts/inter-tight.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-display: swap; font-weight: 100 900; src: url('/fonts/inter.woff2') format('woff2'); }
      @font-face { font-family: 'Geist Mono'; font-display: swap; font-weight: 100 900; src: url('/fonts/geist-mono.woff2') format('woff2'); }
      :root { color-scheme: dark; --bg: #0a0b14; --grid: rgba(255,255,255,.035); --card: #11131f; --text: #f3f3f8; --fg-2: #b6b9cc; --muted: #8e92a8; --rule: rgba(255,255,255,.14); --accent: #9b88ff; --solid: #6b4dff; }
      [data-theme="light"] { color-scheme: light; --bg: #ffffff; --grid: rgba(15,18,40,.045); --card: #ffffff; --text: #0d0f1c; --fg-2: #4b5068; --muted: #6b7086; --rule: rgba(13,15,28,.14); --accent: #5b3df5; --solid: #5b3df5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; font-family: 'Inter', system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased;
        background: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; }
      main { display: flex; flex-direction: column; align-items: center; gap: 22px; max-width: 580px; }
      .logo { border-radius: 12px; box-shadow: 0 10px 24px -8px rgba(91,61,245,.5); }
      .code { padding: 6px 14px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule); font: 500 12px 'Geist Mono', monospace; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-2); }
      h1 { margin: 0; font: 600 clamp(40px, 8vw, 64px)/1.02 'Inter Tight', system-ui, sans-serif; letter-spacing: -.045em; text-wrap: balance; }
      h1 span { color: var(--accent); }
      p { margin: 0; font-size: 18px; line-height: 1.6; color: var(--fg-2); text-wrap: pretty; }
      .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
      a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 500; text-decoration: none; color: var(--text); background: var(--card); box-shadow: inset 0 0 0 1px var(--rule); transition: transform .2s cubic-bezier(.22,1,.36,1); }
      a:hover { transform: translateY(-1px); }
      a.primary { background: var(--solid); color: #fff; box-shadow: 0 10px 24px -10px rgba(91,61,245,.6); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/favicon.svg" alt="" width="56" height="56" />
      <span class="code">404 · page not found</span>
      <h1>This page isn't here, <span>but the work is</span></h1>
      <p>It may have moved when the case studies got their own pages.</p>
      <div class="links">
        <a class="primary" href="/">Go to the homepage</a>
        <a href="/#projects">Browse case studies</a>
      </div>
    </main>
  </body>
</html>
