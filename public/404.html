<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#06070d" />
    <title>Page not found — Pushpendra Singh</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face { font-family: 'Space Grotesk'; font-display: swap; font-weight: 100 900; src: url('/fonts/space-grotesk.woff2') format('woff2'); }
      @font-face { font-family: 'DM Sans'; font-display: swap; font-weight: 100 900; src: url('/fonts/dm-sans.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-display: swap; font-weight: 100 900; src: url('/fonts/jetbrains-mono.woff2') format('woff2'); }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; overflow-x: hidden;
        font-family: 'DM Sans', system-ui, sans-serif; color: #e8e6f3; text-align: center;
        background: radial-gradient(90% 70% at 50% 0%, #161c4a 0%, #080a18 55%, #06070d 100%);
      }
      main { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; max-width: 560px; }
      .glow { position: fixed; left: 50%; top: -30%; width: 900px; height: 900px; margin-left: -450px; border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 58, 237, .32), transparent 60%); filter: blur(30px); pointer-events: none; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .08em; color: #a78bfa; }
      h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: clamp(64px, 16vw, 140px); line-height: .9;
        letter-spacing: -.05em; background: linear-gradient(100deg, #c4b5fd, #8b5cf6 45%, #67e8f9); -webkit-background-clip: text;
        background-clip: text; color: transparent; }
      p { margin: 0; font-size: 18px; line-height: 1.6; color: #b9b6cc; }
      .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
      a { display: inline-flex; padding: 13px 20px; border-radius: 14px; font-weight: 500; text-decoration: none; color: #ece9f8;
        border: 1px solid rgba(255, 255, 255, .16); transition: border-color .25s, background .25s; }
      a:hover { border-color: #a78bfa; background: rgba(139, 92, 246, .12); }
      a.primary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); border-color: transparent; color: #fff; }
      a:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main>
      <span class="code">ERROR 404 · NOT FOUND</span>
      <h1>404</h1>
      <p>This page doesn&rsquo;t exist — it may have moved when the case studies got their own pages.</p>
      <div class="links">
        <a class="primary" href="/">Go to the homepage</a>
        <a href="/#projects">Browse case studies</a>
        <a href="/#contact">Get in touch</a>
      </div>
    </main>
  </body>
</html>
